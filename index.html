<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#101a27" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23c8f36d'/%3E%3Ctext x='16' y='23' font-size='22' text-anchor='middle' fill='%23172432'%3E✦%3C/text%3E%3C/svg%3E" />
  <title>Pixel Manager — Clube Aurora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-shell">
    <aside class="sidebar">
      <a class="brand" href="#" aria-label="Pixel Manager início"><span class="brand-mark">PM<span>+</span></span><span class="brand-name">PIXEL<span>MANAGER</span></span></a>
      <div class="club-mini"><div class="crest crest-small"><span>✦</span></div><div><b>CLUBE AURORA</b><small>Vale do Sol · BR</small></div><span class="online-dot"></span></div>
      <div class="nav-label">ESCRITÓRIO</div>
      <nav class="main-nav" aria-label="Navegação principal">
        <button class="nav-item active" data-page="dashboard"><span class="nav-icon">▦</span> Painel <span class="nav-arrow">›</span></button>
        <button class="nav-item" data-page="squad"><span class="nav-icon">♟</span> Elenco <span class="nav-count" id="squadCount">18</span></button>
        <button class="nav-item" data-page="leagues"><span class="nav-icon">♜</span> Ligas <span class="nav-arrow">›</span></button>
        <button class="nav-item" data-page="finances"><span class="nav-icon">◈</span> Finanças</button>
        <button class="nav-item" data-page="buildings"><span class="nav-icon">⌂</span> Instalações</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="season-card"><div class="season-head"><span class="season-dot"></span> TEMPORADA 04</div><div class="season-name">Era das Estrelas</div><div class="season-progress"><i></i></div><small>Rodada <b id="sideRound">08</b> de 18</small></div>
        <button class="help-link" id="helpBtn">ⓘ <span>Como jogar</span></button>
        <div class="profile"><div class="avatar manager-avatar">✦</div><div><b>Alex Santana</b><small>Treinador · Nível 4</small></div><button id="resetBtn" title="Reiniciar temporada">↻</button></div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar"><div class="breadcrumb"><span>CLUBE AURORA</span><i>/</i><b id="crumbPage">PAINEL</b></div><div class="top-actions"><div class="season-pill"><span>◷</span> Época 4 <b id="topRound">R08</b></div><div class="weather"><span>☀</span> 24° <small>Vale do Sol</small></div><button class="icon-btn" id="soundBtn" title="Som">♫</button><div class="avatar manager-avatar top-avatar">✦</div></div></header>
      <div id="appContent" class="content"></div>
      <footer class="footer"><span>PIXEL MANAGER <b>v1.0</b></span><span>FEITO DE PIXELS <i>♥</i> E FUTEBOL</span></footer>
    </main>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <div id="modalRoot"></div>
  <script src="game.js"></script>
</body>
</html>
